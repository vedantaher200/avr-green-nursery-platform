---
# ─────────────────────────────────────────────────────────────────────────────
# AVRGREEN API — Kubernetes Deployment + HPA
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avrgreen-api
  namespace: avrgreen
  labels:
    app: avrgreen-api
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avrgreen-api
  template:
    metadata:
      labels:
        app: avrgreen-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: avrgreen/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: avrgreen-secrets
            - configMapRef:
                name: avrgreen-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: avrgreen-api-svc
  namespace: avrgreen
spec:
  selector:
    app: avrgreen-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
---
# Horizontal Pod Autoscaler — scales on CPU + custom RPS metric
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: avrgreen-api-hpa
  namespace: avrgreen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: avrgreen-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# ConfigMap for non-secret configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: avrgreen-config
  namespace: avrgreen
data:
  NODE_ENV: "production"
  PORT: "5000"
  API_VERSION: "v1"
  APP_NAME: "AVRGREEN"
  DB_PORT: "5432"
  DB_POOL_MAX: "20"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_AUTH_MAX: "5"
---
# Ingress with TLS termination & WebSocket support
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avrgreen-ingress
  namespace: avrgreen
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upgrade: "websocket"
    nginx.ingress.kubernetes.io/connection-upgrade: "Upgrade"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.avrgreen.com
      secretName: avrgreen-tls
  rules:
    - host: api.avrgreen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avrgreen-api-svc
                port:
                  number: 80
