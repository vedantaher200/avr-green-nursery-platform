name: avrgreen
description: AVRGREEN Enterprise Nursery Management SaaS Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.1
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # Real-time
  socket_io_client: ^2.0.3+1

  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI & Design
  google_fonts: ^6.2.1
  fl_chart: ^0.66.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2
  step_progress_indicator: ^1.0.2
  timeline_tile: ^2.0.0

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Scanner
  mobile_scanner: ^5.0.0

  # File & Permissions
  image_picker: ^1.0.7
  file_picker: ^8.0.3
  permission_handler: ^11.3.0
  path_provider: ^2.1.3

  # Auth & Social
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.11
  retrofit_generator: ^8.1.0
  go_router_builder: ^2.4.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
